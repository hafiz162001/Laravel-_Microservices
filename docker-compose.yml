name: laravel-microservices

services:
  # ==========================================
  # 1. ENTERPRISE API GATEWAY (Traefik v3)
  # ==========================================
  gateway:
    image: traefik:v3.2
    container_name: micro_gateway
    ports:
      - "80:80"
      - "8080:8080" # Traefik Dashboard & Metrics
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - frontend
      - auth-service
      - order-service
      - notification-service
    networks:
      - micro-network

  # ==========================================
  # 2. FRONTEND STATIC SERVER (Nginx)
  # ==========================================
  frontend:
    image: nginx:alpine
    container_name: micro_frontend
    volumes:
      - ./gateway/default.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    networks:
      - micro-network

  # ==========================================
  # 3. REDIS (Caching & Rate Limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: micro_redis
    ports:
      - "6379:6379"
    networks:
      - micro-network

  # ==========================================
  # 4. MESSAGE BROKER (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: micro_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Web Management UI (guest:guest)
    networks:
      - micro-network

  # ==========================================
  # 5. AUTH SERVICE (Laravel + PostgreSQL)
  # ==========================================
  auth-db:
    image: postgres:16-alpine
    container_name: micro_auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - micro-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: micro_auth_service
    environment:
      APP_NAME: "AuthService"
      APP_ENV: local
      APP_KEY: "base64:QbC466E+gwhKgonS6YsbOtn+A/m5hGpR616T5CNTAeE="
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: laravel
      DB_PASSWORD: secretpassword
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "super-secret-jwt-key-for-microservices-demo-2026"
    depends_on:
      - auth-db
      - redis
      - rabbitmq
    networks:
      - micro-network

  # ==========================================
  # 6. ORDER SERVICE (Laravel + PostgreSQL)
  # ==========================================
  order-db:
    image: postgres:16-alpine
    container_name: micro_order_db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - micro-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: micro_order_service
    environment:
      APP_NAME: "OrderService"
      APP_ENV: local
      APP_KEY: "base64:Gdmu18eGg28eYcqaxejyKiAzT8NM66bB0RFfczeZ5qE="
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: order-db
      DB_PORT: 5432
      DB_DATABASE: order_db
      DB_USERNAME: laravel
      DB_PASSWORD: secretpassword
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "super-secret-jwt-key-for-microservices-demo-2026"
      AUTH_SERVICE_URL: "http://auth-service:8000"
      INVENTORY_GRPC_URL: "http://inventory-service:50051"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - order-db
      - redis
      - rabbitmq
      - inventory-service
    networks:
      - micro-network

  # ==========================================
  # 7. INVENTORY SERVICE (Go gRPC Server)
  # ==========================================
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: micro_inventory_service
    ports:
      - "50051:50051" # Native gRPC port (HTTP/2 + Protobuf)
      - "8004:8004"   # HTTP health & Prometheus metrics
    environment:
      GRPC_PORT: 50051
      HTTP_PORT: 8004
    networks:
      - micro-network

  # ==========================================
  # 7. NOTIFICATION SERVICE (Go Polyglot Worker)
  # ==========================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: micro_notification_service
    environment:
      PORT: 8003
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - rabbitmq
    networks:
      - micro-network

  # ==========================================
  # 8. MONITORING (Prometheus & Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: micro_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - micro-network

  grafana:
    image: grafana/grafana:latest
    container_name: micro_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge

volumes:
  auth_db_data:
  order_db_data:
