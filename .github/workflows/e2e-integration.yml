name: E2E Microservices Integration Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  e2e-docker-compose:
    name: Full Stack Docker Compose E2E Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start all microservices (Traefik, Auth, Order, Go gRPC Inventory, Go Notification, Redis, RabbitMQ, Prometheus, Grafana)
        run: docker compose up -d --build

      - name: Wait for Traefik Gateway, Microservices & Monitoring to be ready
        run: |
          echo "Waiting for Gateway, Services, gRPC Inventory, Prometheus & Grafana..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost/healthz > /dev/null && \
               curl -sf http://localhost:8080/ping > /dev/null && \
               curl -sf http://localhost/api/auth/health > /dev/null && \
               curl -sf http://localhost/api/orders/health > /dev/null && \
               curl -sf http://localhost/api/notifications/health > /dev/null && \
               curl -sf http://localhost:8004/health > /dev/null && \
               curl -sf http://localhost:9090/-/healthy > /dev/null && \
               curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "All services and monitoring stack are healthy!"
              break
            fi
            echo "Attempt $i/40: waiting..."
            sleep 3
          done
          curl -f http://localhost/healthz
          curl -f http://localhost:8080/ping
          curl -f http://localhost/api/auth/health
          curl -f http://localhost/api/orders/health
          curl -f http://localhost/api/notifications/health
          curl -f http://localhost:8004/health
          curl -f http://localhost:9090/-/healthy
          curl -f http://localhost:3000/api/health

      - name: Wait for RabbitMQ AMQP & Go Consumer connection
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T order-service php -r "exit(@fsockopen('rabbitmq', 5672) ? 0 : 1);" 2>/dev/null; then
              NOTIF_HEALTH=$(curl -sf http://localhost/api/notifications/health)
              if echo "$NOTIF_HEALTH" | jq -e '.rabbitmq_connected == true' > /dev/null; then
                echo "RabbitMQ AMQP and Go Notification consumer are connected!"
                break
              fi
            fi
            echo "Waiting for RabbitMQ + Go consumer ($i/30)..."
            sleep 3
          done

      - name: Run database migrations in auth-service
        run: |
          for i in $(seq 1 10); do
            if docker compose exec -T auth-service php artisan migrate --force; then
              echo "Migrations succeeded!"
              break
            fi
            echo "Waiting for Postgres ($i/10)..."
            sleep 3
          done

      - name: Run End-to-End Polyglot + gRPC Flow
        run: |
          set -e
          echo "1. Registering user..."
          REG_RES=$(curl -sf -X POST http://localhost/api/auth/register \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"name":"CI Test User","email":"ci@example.com","password":"password123"}')
          echo "Register response: $REG_RES"

          echo "2. Logging in to get JWT..."
          LOGIN_RES=$(curl -sf -X POST http://localhost/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"email":"ci@example.com","password":"password123"}')
          TOKEN=$(echo "$LOGIN_RES" | jq -r '.access_token')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "JWT Token acquired!"

          echo "3. Checking stock via gRPC (Laravel -> Go inventory-service:50051)..."
          STOCK_RES=$(curl -sf "http://localhost/api/orders/stock?item=MacBook%20Pro%20M3")
          echo "gRPC Stock response: $STOCK_RES"
          test "$(echo "$STOCK_RES" | jq -r '.inventory_grpc.connected')" = "true"
          test "$(echo "$STOCK_RES" | jq -r '.inventory_grpc.protocol')" = "gRPC/HTTP2"
          test "$(echo "$STOCK_RES" | jq -r '.inventory_grpc.available_stock')" = "10"

          echo "4. Fetching orders #1 (Expect Redis Cache MISS)..."
          ORDERS_1=$(curl -sf http://localhost/api/orders/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")
          echo "Orders #1 cache_status: $(echo "$ORDERS_1" | jq -r '.cache_status')"
          test "$(echo "$ORDERS_1" | jq -r '.cache_status')" = "MISS"

          echo "5. Fetching orders #2 (Expect Redis Cache HIT)..."
          ORDERS_2=$(curl -sf http://localhost/api/orders/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")
          echo "Orders #2 cache_status: $(echo "$ORDERS_2" | jq -r '.cache_status')"
          test "$(echo "$ORDERS_2" | jq -r '.cache_status')" = "HIT"

          echo "6. Creating order (reserves 2 units via gRPC + publishes to RabbitMQ)..."
          CREATE_RES=$(curl -sf -X POST http://localhost/api/orders/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"item":"MacBook Pro M3","quantity":2,"amount":50000000}')
          echo "Create Order response: $CREATE_RES"
          ORDER_ID=$(echo "$CREATE_RES" | jq -r '.order.order_id')
          test "$(echo "$CREATE_RES" | jq -r '.inventory_grpc.connected')" = "true"
          test "$(echo "$CREATE_RES" | jq -r '.inventory_grpc.success')" = "true"
          test "$(echo "$CREATE_RES" | jq -r '.inventory_grpc.remaining_stock')" = "8"
          test "$(echo "$CREATE_RES" | jq -r '.event.status')" = "PUBLISHED"

          echo "7. Testing gRPC out-of-stock rejection (expect HTTP 409)..."
          OOS_CODE=$(curl -s -o /tmp/oos.json -w "%{http_code}" -X POST http://localhost/api/orders/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"item":"Out Of Stock Item","quantity":1,"amount":100000}')
          echo "Out-of-stock HTTP status: $OOS_CODE ($(cat /tmp/oos.json))"
          test "$OOS_CODE" = "409"

          echo "8. Verifying Go notification-service consumed event from RabbitMQ..."
          FOUND=0
          for i in $(seq 1 10); do
            NOTIF_RES=$(curl -sf http://localhost/api/notifications/)
            if echo "$NOTIF_RES" | jq -e --arg oid "$ORDER_ID" '.notifications[] | select(.order.order_id == $oid)' > /dev/null; then
              echo "Notification confirmed in Go service for $ORDER_ID!"
              FOUND=1
              break
            fi
            sleep 1
          done
          test "$FOUND" = "1"

          echo "9. Checking Prometheus metrics across all services..."
          curl -sf http://localhost/api/auth/metrics | grep -q "auth_service_up 1"
          curl -sf http://localhost/api/orders/metrics | grep -q "orders_created_total 1"
          curl -sf http://localhost/api/notifications/metrics | grep -q "notifications_processed_total 1"
          curl -sf http://localhost:8004/metrics | grep -q "inventory_grpc_requests_total 3"
          echo "All Prometheus & gRPC metrics verified!"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down containers
        if: always()
        run: docker compose down -v
