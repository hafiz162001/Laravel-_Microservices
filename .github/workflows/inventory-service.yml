name: CI/CD Inventory Service (Go gRPC)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/inventory-service/**'
      - 'proto/**'
      - '.github/workflows/inventory-service.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/inventory-service/**'
      - 'proto/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Go gRPC Tests (Inventory Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Tidy & Run Go Tests
        working-directory: ./services/inventory-service
        run: |
          go mod tidy
          go test -v ./...

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/laravel-microservices-inventory" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/inventory-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

