name: CI/CD Auth Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/auth-service/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Laravel Tests (Auth Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, bcmath, sockets
          coverage: none

      - name: Install Composer dependencies
        working-directory: ./services/auth-service
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment & run PHPUnit
        working-directory: ./services/auth-service
        env:
          JWT_SECRET: "super-secret-jwt-key-for-microservices-demo-2026"
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/laravel-microservices-auth" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
