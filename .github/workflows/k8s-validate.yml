name: Validate Kubernetes Manifests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-validate.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  validate-k8s:
    name: Validate K8s YAML Schemas (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate all manifests in k8s/
        run: kubeconform -summary -strict k8s/
