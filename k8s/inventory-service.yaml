apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microservices
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/hafiz162001/laravel-microservices-inventory:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8004
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "8004"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: microservices
spec:
  selector:
    app: inventory-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8004
      targetPort: 8004
